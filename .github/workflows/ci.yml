name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-evidence:
    name: Validate evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate field notes
        run: python3 scripts/check_evidence.py
